<script src="/app.js"></script>

<script>
const HOME_LIMIT = 5;

document.addEventListener("DOMContentLoaded", () => {
  loadTodayVisitCount();
  loadHomePapers();
  loadHomeStudyMaterials();
  loadHomeLinkedIn();
});

function escapeHtml(value) {
  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function formatDate(value) {
  if (!value) return "";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "";
  return date.toLocaleDateString();
}

async function readJsonSafely(response, label = "API request") {
  const contentType = response.headers.get("content-type") || "";
  const text = await response.text();

  if (!contentType.includes("application/json")) {
    console.error(`${label} returned non-JSON response`, {
      status: response.status,
      contentType,
      preview: text.slice(0, 800)
    });

    throw new Error(
      `${label} returned non-JSON response. HTTP ${response.status}.`
    );
  }

  try {
    return JSON.parse(text);
  } catch (error) {
    console.error(`${label} returned invalid JSON`, {
      status: response.status,
      preview: text.slice(0, 800),
      error
    });

    throw new Error(
      `${label} returned invalid JSON. HTTP ${response.status}.`
    );
  }
}

function renderEmpty(box, message) {
  if (!box) return;
  box.innerHTML = `<p class="empty-posts">${escapeHtml(message)}</p>`;
}

function renderError(box, message) {
  if (!box) return;
  box.innerHTML = `<p class="error-text">${escapeHtml(message)}</p>`;
}

async function loadTodayVisitCount() {
  const box = document.getElementById("todayVisitCount");
  if (!box) return;

  try {
    const res = await fetch("/api/public/visits/today", {
      headers: {
        "Accept": "application/json"
      }
    });

    const data = await readJsonSafely(res, "Today visits API");

    box.textContent = data.ok
      ? Number(data.total || 0).toLocaleString()
      : "-";
  } catch (error) {
    console.error(error);
    box.textContent = "-";
  }
}

async function fetchPosts(section, type, label) {
  const params = new URLSearchParams({
    section,
    type,
    page: "1"
  });

  const res = await fetch("/api/posts?" + params.toString(), {
    headers: {
      "Accept": "application/json"
    }
  });

  const data = await readJsonSafely(res, label);

  if (!res.ok || !data.ok) {
    throw new Error(data.error || `${label} failed.`);
  }

  return Array.isArray(data.posts) ? data.posts : [];
}

async function loadHomePapers() {
  const box = document.getElementById("homePapers");
  if (!box) return;

  try {
    const posts = (await fetchPosts("research", "paper", "Home papers API"))
      .slice(0, HOME_LIMIT);

    if (posts.length === 0) {
      renderEmpty(box, "No Vision GPT DB updates yet.");
      return;
    }

    box.innerHTML = posts.map(p => `
      <div class="home-list-item">
        <h3>${escapeHtml(p.title)}</h3>
        <p>Research Paper · ${formatDate(p.created_at)}</p>
      </div>
    `).join("");
  } catch (error) {
    console.error(error);
    renderError(box, "Could not load Vision GPT DB updates.");
  }
}

function getStudyTypeLabel(type) {
  if (type === "study" || type === "study_post") return "Study";
  if (type === "methodology_page") return "Methodology";
  if (type === "blog") return "Blog";
  return "Study Material";
}

async function loadHomeStudyMaterials() {
  const box = document.getElementById("homeStudyMaterials");
  if (!box) return;

  try {
    const posts = (await fetchPosts("study", "study", "Study materials API"))
      .slice(0, HOME_LIMIT);

    if (posts.length === 0) {
      renderEmpty(box, "No study materials yet.");
      return;
    }

    box.innerHTML = posts.map(p => `
      <div class="home-list-item">
        <h3>${escapeHtml(p.title)}</h3>
        <p>${getStudyTypeLabel(p.type)} · ${formatDate(p.created_at)}</p>
      </div>
    `).join("");
  } catch (error) {
    console.error(error);
    renderError(box, "Could not load study materials.");
  }
}

async function loadHomeLinkedIn() {
  const box = document.getElementById("homeLinkedin");
  if (!box) return;

  try {
    const posts = (await fetchPosts("career", "linkedin", "LinkedIn posts API"))
      .slice(0, HOME_LIMIT);

    if (posts.length === 0) {
      renderEmpty(box, "No LinkedIn posts yet.");
      return;
    }

    box.innerHTML = posts.map(p => `
      <div class="home-list-item">
        <h3>${escapeHtml(p.title)}</h3>
        <p>LinkedIn Promotion · ${formatDate(p.created_at)}</p>
      </div>
    `).join("");
  } catch (error) {
    console.error(error);
    renderError(box, "Could not load LinkedIn posts.");
  }
}
</script>
