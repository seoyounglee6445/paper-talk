<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paper_Talk</title>
<link rel="stylesheet" href="/style.css">
</head>

<body>
<header class="header">
  <nav class="nav">
    <div class="logo">Paper_Talk</div>
    <a href="/">Home</a>
    <a href="/research.html">Research Paper</a>
    <a href="/study.html">Study Materials</a>
    <a href="/community.html">Community</a>
    <a href="/career.html">Career</a>
  </nav>
</header>

<main class="container">
  <h1>Paper_Talk</h1>
  <p>Research paper, conference notice, and LinkedIn networking platform.</p>

  <section class="home-three-grid">
    <div class="home-column">
      <h2>Latest Papers</h2>
      <div id="homePapers"></div>
    </div>

    <div class="home-column">
      <h2>Conference Notices</h2>
      <div id="homeConference"></div>
    </div>

    <div class="home-column">
      <h2>LinkedIn</h2>
      <div id="homeLinkedin"></div>
    </div>
  </section>
</main>

<script src="/app.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  loadPosts({
    section: "research",
    target: "homePapers"
  });

  loadPosts({
    section: "community",
    type: "conference_notice",
    target: "homeConference"
  });

  loadHomeLinkedIn();
});

async function loadHomeLinkedIn() {
  const res = await fetch("/api/posts?section=career&type=linkedin");
  const data = await res.json();

  const box = document.getElementById("homeLinkedin");
  if (!box) return;

  if (!data.posts || data.posts.length === 0) {
    box.innerHTML = `<p class="empty-posts">No LinkedIn posts yet.</p>`;
    return;
  }

  box.innerHTML = data.posts.map(p => `
    <article class="home-mini-card">
      <h3>${escapeHtml(p.title)}</h3>

      <p class="post-meta">
        LinkedIn Promotion · ${new Date(p.created_at).toLocaleDateString()}
      </p>

      <p class="post-author">By ${escapeHtml(p.author_name)}</p>
    </article>
  `).join("");
}
</script>
</body>
</html>
