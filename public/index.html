<title>Paper_Talk | Cancer Genomics, Bioinformatics and Research Papers</title>
<link rel="stylesheet" href="/style.css">

<style>
.home-title-row {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.member-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  border: 1px solid #b7c4ff;
  border-radius: 999px;
  background: white;
  color: #526174;
  font-size: 13px;
  font-weight: 700;
  box-shadow: 0 10px 24px rgba(20, 45, 140, 0.08);
}

.member-pill strong {
  color: #071f9f;
  font-size: 16px;
  font-weight: 800;
}
</style>
</head>

<body>
<header class="header">
  <nav class="nav">
    <div class="logo">Paper_Talk</div>
    <a href="/">Home</a>
    <a href="/research.html">Research Paper</a>
    <a href="/study.html">Study Materials</a>
    <a href="/visium-gpt.html">Paper_Talk Vision GPT</a>
    <a href="/community.html">Community</a>
    <a href="/career.html">Career</a>
  </nav>
</header>

<main class="container">
  <h1 class="home-title-row">
    <span>Paper_Talk</span>
    <span class="member-pill">
      Today’s visits
      <strong id="todayVisitCount">Loading...</strong>
    </span>
  </h1>

  <p>Research paper, conference notice, and LinkedIn networking platform.</p>

  <section class="home-three-grid">
    <div class="home-column">
      <h2>Latest Papers</h2>
      <div id="homePapers"></div>
    </div>

    <div class="home-column">
      <h2>Conference Notices</h2>
      <div id="homeConference"></div>
    </div>

    <div class="home-column">
      <h2>LinkedIn</h2>
      <div id="homeLinkedin"></div>
    </div>
  </section>
</main>

<script src="/app.js"></script>

<script>
const HOME_LIMIT = 5;

document.addEventListener("DOMContentLoaded", () => {
  loadTodayVisitCount();
  loadHomePapers();
  loadHomeConference();
  loadHomeLinkedIn();
});

function formatDate(value) {
  if (!value) return "";
  return new Date(value).toLocaleDateString();
}

async function loadTodayVisitCount() {
  const box = document.getElementById("todayVisitCount");
  if (!box) return;

  try {
    const res = await fetch("/api/public/visits/today");
    const data = await res.json();

    box.textContent = data.ok
      ? Number(data.total || 0).toLocaleString()
      : "-";
  } catch {
    box.textContent = "-";
  }
}

async function loadHomePapers() {
  const res = await fetch("/api/posts?section=research&type=paper&page=1");
  const data = await res.json();

  const box = document.getElementById("homePapers");
  if (!box) return;

  const posts = (data.posts || []).slice(0, HOME_LIMIT);

  if (posts.length === 0) {
    box.innerHTML = `<p class="empty-posts">No papers yet.</p>`;
    return;
  }

  box.innerHTML = posts.map(p => `
    <div class="home-list-item">
      <h3>${escapeHtml(p.title)}</h3>
      <p>Research Paper · ${formatDate(p.created_at)}</p>
    </div>
  `).join("");
}

async function loadHomeConference() {
  const res = await fetch("/api/posts?section=community&type=conference_notice&page=1");
  const data = await res.json();

  const box = document.getElementById("homeConference");
  if (!box) return;

  const posts = (data.posts || []).slice(0, HOME_LIMIT);

  if (posts.length === 0) {
    box.innerHTML = `<p class="empty-posts">No conference notices yet.</p>`;
    return;
  }

  box.innerHTML = posts.map(p => `
    <div class="home-list-item">
      <h3>${escapeHtml(p.title)}</h3>
      <p>Conference Notice · ${formatDate(p.created_at)}</p>
    </div>
  `).join("");
}

async function loadHomeLinkedIn() {
  const res = await fetch("/api/posts?section=career&type=linkedin&page=1");
  const data = await res.json();

  const box = document.getElementById("homeLinkedin");
  if (!box) return;

  const posts = (data.posts || []).slice(0, HOME_LIMIT);

  if (posts.length === 0) {
    box.innerHTML = `<p class="empty-posts">No LinkedIn posts yet.</p>`;
    return;
  }

  box.innerHTML = posts.map(p => `
    <div class="home-list-item">
      <h3>${escapeHtml(p.title)}</h3>
      <p>LinkedIn Promotion · ${formatDate(p.created_at)}</p>
    </div>
  `).join("");
}
</script>
</body>
</html>
