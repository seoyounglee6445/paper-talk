<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Paper_Talk</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
<header class="header">
  <nav class="nav">
    <div class="logo">Paper_Talk Admin</div>
    <a href="/">Home</a>
    <a href="/admin.html">Admin</a>
    <a href="/admin-gpt.html">GPT Usage</a>
    <a href="/admin-specialist-gpts.html">Research GPTs</a>
    <a href="/research">Research Paper</a>
    <a href="/study">Study Materials</a>
    <a href="/community">Community</a>
    <a href="/career">Career</a>
  </nav>
</header>

<main class="container">
  <h1>GPT Usage</h1>
  <p>View all Paper_Talk Vision GPT chats created by signed-in users.</p>

  <section class="card">
    <h2>Admin Access</h2>
    <p>Enter your admin key once. It will be saved for 1 hour.</p>

    <label>Admin Key</label>
    <input id="adminKey" type="password" placeholder="Enter admin key">

    <button onclick="saveKey()">Save Key</button>
    <button class="danger-btn" onclick="clearKey()">Clear Admin Key</button>
    <p id="status"></p>
  </section>

  <div id="adminGptContent" style="display:none;">
    <section class="card">
      <h2>GPT Chat Threads</h2>
      <button onclick="loadThreads()">Load GPT Chats</button>
      <div id="threadList"></div>
    </section>

    <section class="card">
      <h2>Messages</h2>
      <div id="messageList"></div>
    </section>
  </div>
</main>

<script>
const KEY_NAME = "paperTalkAdminKey";
const KEY_EXPIRES = "paperTalkAdminKeyExpires";
const ONE_HOUR = 60 * 60 * 1000;

function escapeHtml(value) {
  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function updateAdminVisibility() {
  const content = document.getElementById("adminGptContent");
  const status = document.getElementById("status");
  const key = localStorage.getItem(KEY_NAME) || "";
  const expires = Number(localStorage.getItem(KEY_EXPIRES) || 0);

  if (!key || Date.now() > expires) {
    content.style.display = "none";
    status.textContent = "Admin key is not saved.";
    return;
  }

  const minutesLeft = Math.max(Math.ceil((expires - Date.now()) / 60000), 0);
  content.style.display = "block";
  status.textContent = `Admin key saved. Expires in about ${minutesLeft} minutes.`;
}

function saveKey() {
  const key = document.getElementById("adminKey").value.trim();

  if (!key) {
    alert("Please enter admin key.");
    return;
  }

  localStorage.setItem(KEY_NAME, key);
  localStorage.setItem(KEY_EXPIRES, String(Date.now() + ONE_HOUR));
  updateAdminVisibility();
  alert("Admin key saved for 1 hour.");
}

function clearKey() {
  localStorage.removeItem(KEY_NAME);
  localStorage.removeItem(KEY_EXPIRES);
  document.getElementById("adminKey").value = "";
  document.getElementById("threadList").innerHTML = "";
  document.getElementById("messageList").innerHTML = "";
  updateAdminVisibility();
}

function getKey() {
  const key = localStorage.getItem(KEY_NAME) || "";
  const expires = Number(localStorage.getItem(KEY_EXPIRES) || 0);

  if (!key || Date.now() > expires) {
    clearKey();
    return "";
  }

  return key;
}

async function loadThreads() {
  const key = getKey();

  if (!key) {
    alert("Please enter admin key.");
    return;
  }

  const res = await fetch("/api/admin/gpt/threads?key=" + encodeURIComponent(key));
  const data = await res.json();

  const box = document.getElementById("threadList");

  if (!data.ok) {
    box.innerHTML = `<p class="error">${escapeHtml(data.error || "Failed to load GPT chats.")}</p>`;
    return;
  }

  if (!data.threads.length) {
    box.innerHTML = "<p>No GPT chats yet.</p>";
    return;
  }

  box.innerHTML = data.threads.map(t => `
    <article class="post-card">
      <h3>${escapeHtml(t.title || "New chat")}</h3>
      <p><strong>User:</strong> ${escapeHtml(t.user_name || "")}</p>
      <p><strong>Email:</strong> ${escapeHtml(t.user_email || "")}</p>
      <p><strong>Created:</strong> ${escapeHtml(t.created_at)}</p>
      <p><strong>Updated:</strong> ${escapeHtml(t.updated_at)}</p>
      <button onclick="loadMessages('${escapeHtml(t.id)}')">View Messages</button>
    </article>
  `).join("");
}

async function loadMessages(threadId) {
  const key = getKey();

  if (!key) {
    alert("Please enter admin key.");
    return;
  }

  const params = new URLSearchParams({
    key,
    threadId
  });

  const res = await fetch("/api/admin/gpt/messages?" + params.toString());
  const data = await res.json();

  const box = document.getElementById("messageList");

  if (!data.ok) {
    box.innerHTML = `<p class="error">${escapeHtml(data.error || "Failed to load messages.")}</p>`;
    return;
  }

  if (!data.messages.length) {
    box.innerHTML = "<p>No messages found.</p>";
    return;
  }

  box.innerHTML = data.messages.map(m => `
    <article class="post-card">
      <p><strong>${escapeHtml(m.role)}</strong></p>
      <p class="post-body">${escapeHtml(m.content).replaceAll("\\n", "<br>")}</p>
      <p class="post-meta">${escapeHtml(m.created_at)}</p>
    </article>
  `).join("");
}

window.addEventListener("load", () => {
  const key = localStorage.getItem(KEY_NAME);
  const expires = Number(localStorage.getItem(KEY_EXPIRES) || 0);

  if (key && Date.now() <= expires) {
    document.getElementById("adminKey").value = key;
  }

  updateAdminVisibility();
});
</script>
</body>
</html>
