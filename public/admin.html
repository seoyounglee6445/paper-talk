<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Paper_Talk</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
<header class="header">
  <nav class="nav">
    <div class="logo">Paper_Talk Admin</div>
    <a href="/">Home</a>
    <a href="/research">Research Paper</a>
    <a href="/study">Study Materials</a>
    <a href="/community">Community</a>
    <a href="/career">Career</a>
  </nav>
</header>

<main class="container">
  <h1>Site Admin</h1>
  <p>Manage research papers, study materials, methodology links, blog posts, approvals, and deletion.</p>

  <section class="card write-form">
    <h2>New Research Paper</h2>

    <form onsubmit="createResearchPaper(event)">
      <div>
        <label>Admin Key</label>
        <input id="researchAdminKey" type="password" placeholder="Enter admin key" required>
      </div>

      <div>
        <label>Title</label>
        <input name="title" required placeholder="Paper title">
      </div>

      <div>
        <label>Year</label>
        <input name="year" placeholder="2026">
      </div>

      <div>
        <label>Authors</label>
        <input name="authors" placeholder="Author names">
      </div>

      <div>
        <label>Journal</label>
        <input name="journal" placeholder="Journal name">
      </div>

      <div>
        <label>Category</label>
        <input name="category" placeholder="Cancer genomics, single-cell, spatial...">
      </div>

      <div class="full-row">
        <label>Abstract</label>
        <textarea name="abstract" placeholder="Paste abstract here"></textarea>
      </div>

      <div>
        <label>Article Link</label>
        <input name="articleLink" placeholder="https://doi.org/...">
      </div>

      <div>
        <label>PDF / File Link</label>
        <input name="pdfLink" placeholder="Google Drive, PDF, or file link">
      </div>

      <div class="full-row">
        <label>Figure Image URLs</label>
        <textarea name="figures" placeholder="One image URL per line"></textarea>
      </div>

      <div>
        <label>Tags</label>
        <input name="tags" placeholder="RNA velocity, single-cell, spatial">
      </div>

      <div class="full-row">
        <label>Description</label>
        <textarea name="description" placeholder="Optional description"></textarea>
      </div>

      <div class="full-row">
        <label>Note</label>
        <textarea name="note" placeholder="Optional note"></textarea>
      </div>

      <button type="submit">Save Research Paper</button>
    </form>
  </section>

  <section class="card write-form">
    <h2>New Study Content</h2>
    <p>Use this for Methodology and Blog pages.</p>

    <form onsubmit="createStudyContent(event)">
      <div>
        <label>Admin Key</label>
        <input id="studyAdminKey" type="password" placeholder="Enter admin key" required>
      </div>

      <div>
        <label>Type</label>
        <select name="type" required>
          <option value="methodology">Methodology</option>
          <option value="blog">Blog</option>
        </select>
      </div>

      <div>
        <label>Title</label>
        <input name="title" required placeholder="Title">
      </div>

      <div>
        <label>Website / Blog Name</label>
        <input name="websiteName" placeholder="Website or blog name">
      </div>

      <div>
        <label>Original Author</label>
        <input name="author" placeholder="Author name">
      </div>

      <div>
        <label>Source URL</label>
        <input name="sourceUrl" placeholder="https://...">
      </div>

      <div>
        <label>Tags</label>
        <input name="tags" placeholder="pipeline, statistics, single-cell">
      </div>

      <div class="full-row">
        <label>Summary / Organized Notes</label>
        <textarea name="summary" placeholder="Write your organized methodology notes or blog summary here"></textarea>
      </div>

      <div class="full-row">
        <label>Note</label>
        <textarea name="note" placeholder="Optional note"></textarea>
      </div>

      <button type="submit">Save Study Content</button>
    </form>
  </section>

  <section class="card">
    <h2>Manage Posts</h2>

    <label>Admin Key</label>
    <input id="adminKey" type="password" placeholder="Enter admin key">

    <label>Section</label>
    <select id="sectionFilter">
      <option value="">All Sections</option>
      <option value="research">Research Paper</option>
      <option value="study">Study Materials</option>
      <option value="community">Community</option>
      <option value="career">Career</option>
    </select>

    <label>Category</label>
    <select id="typeFilter">
      <option value="">All Categories</option>
      <option value="paper">Research Paper</option>
      <option value="linkedin">LinkedIn Promotion</option>
      <option value="job">Job Posting</option>
      <option value="jobsite">Job Website</option>
      <option value="collaboration">Collaboration Hub</option>
      <option value="question">Question / Discussion</option>
      <option value="conference_notice">Conference Notice</option>
      <option value="study_post">Study</option>
      <option value="methodology">Methodology</option>
      <option value="blog">Blog</option>
    </select>

    <label>Status</label>
    <select id="statusFilter">
      <option value="">All Status</option>
      <option value="pending">Pending</option>
      <option value="published">Published</option>
    </select>

    <button onclick="loadAdminPosts()">Load Posts</button>
  </section>

  <h2>Posts</h2>
  <div id="adminPostList"></div>
</main>

<script>
function escapeHtml(value) {
  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function parseJsonBody(body) {
  try {
    return JSON.parse(body || "{}");
  } catch {
    return {};
  }
}

async function createResearchPaper(e) {
  e.preventDefault();

  const key = document.getElementById("researchAdminKey").value;
  const form = new FormData(e.target);
  const data = Object.fromEntries(form.entries());

  const res = await fetch("/api/admin/research/create", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-Admin-Key": key
    },
    body: JSON.stringify(data)
  });

  const result = await res.json();

  if (!result.ok) {
    alert(result.error || "Save failed");
    return;
  }

  alert("Research paper saved.");
  e.target.reset();
  loadAdminPosts();
}

async function createStudyContent(e) {
  e.preventDefault();

  const key = document.getElementById("studyAdminKey").value;
  const form = new FormData(e.target);
  const data = Object.fromEntries(form.entries());

  const res = await fetch("/api/admin/study/create", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-Admin-Key": key
    },
    body: JSON.stringify(data)
  });

  const result = await res.json();

  if (!result.ok) {
    alert(result.error || "Save failed");
    return;
  }

  alert("Study content saved.");
  e.target.reset();
  loadAdminPosts();
}

async function loadAdminPosts() {
  const key =
    document.getElementById("adminKey").value ||
    document.getElementById("researchAdminKey").value ||
    document.getElementById("studyAdminKey").value;

  const section = document.getElementById("sectionFilter").value;
  const type = document.getElementById("typeFilter").value;
  const status = document.getElementById("statusFilter").value;

  const params = new URLSearchParams({ key });

  if (section) params.set("section", section);
  if (type) params.set("type", type);
  if (status) params.set("status", status);

  const res = await fetch("/api/admin/posts?" + params.toString());
  const data = await res.json();

  const box = document.getElementById("adminPostList");

  if (!data.ok) {
    box.innerHTML = `<p class="error">${escapeHtml(data.error || "Failed")}</p>`;
    return;
  }

  if (!data.posts.length) {
    box.innerHTML = "<p>No posts found.</p>";
    return;
  }

  box.innerHTML = data.posts.map(post => {
    const parsed = ["research", "study"].includes(post.section) ? parseJsonBody(post.body) : null;

    return `
      <article class="post-card">
        <div class="post-card-header">
          <div>
            <h3>${escapeHtml(post.title)}</h3>
            <p class="post-meta">
              ${escapeHtml(post.section)} · ${escapeHtml(post.type)} · ${escapeHtml(post.status)}
            </p>
          </div>
          <span class="post-badge">${escapeHtml(post.status)}</span>
        </div>

        ${
          post.section === "research" && parsed
            ? `
              <p><strong>Year:</strong> ${escapeHtml(parsed.year)}</p>
              <p><strong>Authors:</strong> ${escapeHtml(parsed.authors)}</p>
              <p><strong>Journal:</strong> ${escapeHtml(parsed.journal)}</p>
              <p class="post-body">${escapeHtml(parsed.abstract)}</p>
            `
            : ""
        }

        ${
          post.section === "study" && parsed
            ? `
              <p><strong>Website:</strong> ${escapeHtml(parsed.websiteName)}</p>
              <p><strong>Original Author:</strong> ${escapeHtml(parsed.author)}</p>
              <p><strong>Tags:</strong> ${escapeHtml(parsed.tags)}</p>
              <p class="post-body">${escapeHtml(parsed.summary)}</p>
            `
            : ""
        }

        ${
          !parsed
            ? `<p class="post-body">${escapeHtml(post.body)}</p>`
            : ""
        }

        ${post.link ? `<p><a class="btn" href="${escapeHtml(post.link)}" target="_blank">Open Link</a></p>` : ""}
        ${parsed && parsed.pdfLink ? `<p><a class="btn" href="${escapeHtml(parsed.pdfLink)}" target="_blank">Open PDF/File</a></p>` : ""}

        <p><strong>Author:</strong> ${escapeHtml(post.author_name)}</p>
        <p><strong>Email:</strong> ${escapeHtml(post.author_email)}</p>

        <div class="post-actions">
          ${post.status === "pending" ? `<button onclick="approvePost('${post.id}')">Approve</button>` : ""}
          <button class="danger-btn" onclick="deletePost('${post.id}')">Delete</button>
        </div>
      </article>
    `;
  }).join("");
}

async function approvePost(id) {
  const key =
    document.getElementById("adminKey").value ||
    document.getElementById("researchAdminKey").value ||
    document.getElementById("studyAdminKey").value;

  const res = await fetch("/api/admin/approve", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-Admin-Key": key
    },
    body: JSON.stringify({ id })
  });

  const data = await res.json();

  if (!data.ok) {
    alert(data.error || "Approve failed");
    return;
  }

  loadAdminPosts();
}

async function deletePost(id) {
  if (!confirm("Delete this post?")) return;

  const key =
    document.getElementById("adminKey").value ||
    document.getElementById("researchAdminKey").value ||
    document.getElementById("studyAdminKey").value;

  const res = await fetch("/api/admin/delete", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-Admin-Key": key
    },
    body: JSON.stringify({ id })
  });

  const data = await res.json();

  if (!data.ok) {
    alert(data.error || "Delete failed");
    return;
  }

  loadAdminPosts();
}
</script>
</body>
</html>
