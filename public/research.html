<title>Research Paper | Paper_Talk</title>
<link rel="stylesheet" href="/style.css">
<style>
#researchList {
  width: 100%;
}

#researchList .post-card,
#researchList .login-required-box {
  width: 100%;
  max-width: none;
  box-sizing: border-box;
}

#researchList .login-required-box {
  background: #ffffff;
  border: 1px solid #b9c7ff;
  border-radius: 24px;
  padding: 28px;
  box-shadow: 0 18px 40px rgba(0,0,0,0.04);
}
</style>
</head>

<body>
<header class="header">
 <nav class="nav">
  <a href="/" class="logo">Paper_Talk</a>
  <a href="/">Home</a>
  <a href="/research.html">Research Paper</a>
  <a href="/study.html">Study Materials</a>
  <a href="/visium-gpt.html">Paper_Talk Vision GPT</a>
  <a href="/Specialist GPTs.html">Specialist GPTs</a>
  <a href="/community.html">Community</a>
  <a href="/career.html">Career</a>
</nav>
</header>

<main class="container">
  <div class="auth-box" style="text-align:right; margin-bottom:20px;">
    <span id="userInfo"></span>
    <a id="loginBtn" class="btn" href="/auth/google">Sign in with Google</a>
    <a id="logoutBtn" class="btn danger-btn" href="/auth/logout" style="display:none;">Logout</a>
  </div>

  <h1>Research Paper</h1>
  <p>Browse research papers uploaded by the admin.</p>

  <div class="toolbar">
    <input class="search-input" id="paperSearch" placeholder="Search papers..." oninput="filterPapers()">
  </div>

  <section id="researchList"></section>
  <div id="pagination" class="pagination"></div>
</main>

<script src="/app.js"></script>

<script>
let currentPage = 1;
let isLoggedIn = false;

document.addEventListener("DOMContentLoaded", async () => {
  await checkLoginStatus();

  if (!isLoggedIn) {
    showLoginRequired();
    return;
  }

  loadResearchPapers(1);
});

async function checkLoginStatus() {
  const res = await fetch("/api/me");
  const data = await res.json();

  isLoggedIn = Boolean(data.ok && data.user);

  const userInfo = document.getElementById("userInfo");
  const loginBtn = document.getElementById("loginBtn");
  const logoutBtn = document.getElementById("logoutBtn");

  if (isLoggedIn) {
    userInfo.textContent = `${data.user.name} `;
    loginBtn.style.display = "none";
    logoutBtn.style.display = "inline-block";
  } else {
    userInfo.textContent = "Sign in to view all papers. ";
    loginBtn.style.display = "inline-block";
    logoutBtn.style.display = "none";
  }
}

function showLoginRequired() {
  const toolbar = document.querySelector(".toolbar");
  const box = document.getElementById("researchList");
  const pagination = document.getElementById("pagination");

  if (toolbar) toolbar.style.display = "none";
  if (pagination) pagination.innerHTML = "";

  box.innerHTML = `
    <article class="login-required-box">
      <h3>Login Required</h3>
      <p class="post-body">Please sign in with Google to view research papers.</p>
      <a class="btn" href="/auth/google">Sign in with Google</a>
    </article>
  `;
}

async function loadResearchPapers(page = 1) {
  if (!isLoggedIn) {
    showLoginRequired();
    return;
  }

  currentPage = page;

  const res = await fetch("/api/posts?section=research&type=paper&page=" + page);
  const data = await res.json();

  const box = document.getElementById("researchList");

  if (!data.ok) {
    box.innerHTML = `<p class="empty-posts">${escapeHtml(data.error || "Failed to load papers.")}</p>`;
    return;
  }

  if (!data.posts || data.posts.length === 0) {
    box.innerHTML = `<p class="empty-posts">No research papers yet.</p>`;
    renderPagination(data);
    return;
  }

  box.innerHTML = data.posts.map(renderResearchPaper).join("");
  renderPagination(data);
}

function renderPagination(data) {
  const pagination = document.getElementById("pagination");
  if (!pagination) return;

  if (!data.isLoggedIn) {
    pagination.innerHTML = `
      <p class="empty-posts">
        Sign in with Google to view older papers.
      </p>
    `;
    return;
  }

  if (!data.totalPages || data.totalPages <= 1) {
    pagination.innerHTML = "";
    return;
  }

  pagination.innerHTML = Array.from({ length: data.totalPages }, (_, i) => {
    const page = i + 1;

    return `
      <button
        class="page-btn ${page === data.page ? "active" : ""}"
        onclick="loadResearchPapers(${page})"
      >
        ${page}
      </button>
    `;
  }).join("");
}

function renderResearchPaper(p) {
  let info = {};

  try {
    info = JSON.parse(p.body || "{}");
  } catch {
    info = {};
  }

  const figures = String(info.figures || "")
    .split("\n")
    .map(v => v.trim())
    .filter(Boolean);

  return `
    <article class="post-card research-paper-card">
      <div class="post-card-header">
        <div>
          <h3>${escapeHtml(p.title)}</h3>
          <p class="post-meta">
            ${escapeHtml(info.journal || "Research Paper")}
            ${info.year ? " · " + escapeHtml(info.year) : ""}
          </p>
        </div>
        <span class="post-badge">Research Paper</span>
      </div>

      ${info.authors ? `<p class="post-author">${escapeHtml(info.authors)}</p>` : ""}

      ${info.abstract ? `
        <p class="post-body">
          ${escapeHtml(info.abstract)}
        </p>
      ` : ""}

      ${figures.length ? `
        <div class="research-figures">
          ${figures.map(url => `
            <img src="${escapeHtml(url)}" alt="Research figure">
          `).join("")}
        </div>
      ` : ""}

      <div class="post-actions">
        ${p.link ? `<a class="btn" href="${safeUrl(p.link)}" target="_blank">Open Article</a>` : ""}
        ${info.pdfLink ? `<a class="btn" href="${safeUrl(info.pdfLink)}" target="_blank">Open PDF / File</a>` : ""}
      </div>

      ${info.tags ? `<p class="post-meta">Tags: ${escapeHtml(info.tags)}</p>` : ""}
    </article>
  `;
}

function filterPapers() {
  const keyword = document.getElementById("paperSearch").value.toLowerCase();
  const cards = document.querySelectorAll(".research-paper-card");

  cards.forEach(card => {
    const text = card.textContent.toLowerCase();
    card.style.display = text.includes(keyword) ? "block" : "none";
  });
}

function safeUrl(value) {
  const url = String(value || "").trim();
  if (!url) return "";
  if (url.startsWith("http://") || url.startsWith("https://")) return escapeHtml(url);
  return escapeHtml("https://" + url);
}
</script>
</body>
</html>
