<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Paper | Paper_Talk</title>
<link rel="stylesheet" href="/style.css">
</head>

<body>
<header class="header">
  <nav class="nav">
    <div class="logo">Paper_Talk</div>
    <a href="/">Home</a>
    <a href="/research.html">Research Paper</a>
    <a href="/study.html">Study Materials</a>
    <a href="/community.html">Community</a>
    <a href="/career.html">Career</a>
  </nav>
</header>

<main class="container">
  <h1>Research Paper</h1>
  <p>Full research paper list. 10 papers per page.</p>

  <div class="toolbar">
    <input class="search-input" id="paperSearch" placeholder="Search research papers...">
    <button class="write-btn" onclick="searchPapers()">Search</button>
  </div>

  <section class="card">
    <h2>Research Papers</h2>

    <div id="paperList">
      <p>No papers yet.</p>
    </div>
  </section>
</main>

<script>
function searchPapers() {
  const keyword = document.getElementById("paperSearch").value.toLowerCase();
  const items = document.querySelectorAll(".paper-item");

  items.forEach(item => {
    const text = item.textContent.toLowerCase();

    if (text.includes(keyword)) {
      item.style.display = "block";
    } else {
      item.style.display = "none";
    }
  });
}
</script>
</body>
</html>
