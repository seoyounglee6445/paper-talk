<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow, noai, noimageai">
  <title>Study Materials | Paper_Talk</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
<header class="header">
  <nav class="nav">
    <div class="logo">Paper_Talk</div>
    <a href="/">Home</a>
    <a href="/research">Research Paper</a>
    <a href="/study">Study Materials</a>
    <a href="/community">Community</a>
    <a href="/career">Career</a>
  </nav>
</header>

<main class="container">
  <h1>Study Materials</h1>
  <p>Choose a study category.</p>

  <div class="category-tabs">
    <button class="tab-btn active" onclick="showStudyCategory('study_post', this)">Study</button>
    <button class="tab-btn" onclick="showStudyCategory('methodology_page', this)">Methodology</button>
    <button class="tab-btn" onclick="showStudyCategory('blog', this)">Blog</button>
  </div>

  <section class="card">
    <h2 id="categoryTitle">Study</h2>
    <p id="categoryDescription">
      General study materials and learning posts will be organized here.
    </p>
  </section>

  <section id="postList"></section>
</main>

<script>
let currentType = "study_post";

function escapeHtml(value) {
  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function formatText(value) {
  return escapeHtml(value).replaceAll("\n", "<br>");
}

function parseJsonBody(body) {
  try {
    return JSON.parse(body || "{}");
  } catch {
    return {};
  }
}

function showStudyCategory(type, button) {
  currentType = type;

  document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
  button.classList.add("active");

  const title = document.getElementById("categoryTitle");
  const description = document.getElementById("categoryDescription");

  if (type === "study_post") {
    title.textContent = "Study";
    description.textContent = "General study materials and learning posts will be organized here.";
  }

  if (type === "methodology_page") {
    title.textContent = "Methodology";
    description.textContent = "Curated methodology notes, useful websites, workflows, and reference links.";
  }

  if (type === "blog") {
    title.textContent = "Blog";
    description.textContent = "Curated external blog posts and web articles related to research.";
  }

  loadPosts();
}

async function loadPosts() {
  const box = document.getElementById("postList");
  box.innerHTML = "<p>Loading...</p>";

  const params = new URLSearchParams({
    section: "study",
    type: currentType
  });

  const res = await fetch("/api/posts?" + params.toString());
  const data = await res.json();

  if (!data.ok) {
    box.innerHTML = `<p class="error">${escapeHtml(data.error || "Failed to load posts.")}</p>`;
    return;
  }

  if (!data.posts.length) {
    box.innerHTML = "<p>No content yet.</p>";
    return;
  }

  return `
    <article class="post-card">
      <div class="post-card-header">
        <div>
          <h3>${escapeHtml(post.title)}</h3>
          <p class="post-meta">${escapeHtml(post.author_name || "Admin")} · Methodology</p>
        </div>
        <span class="post-badge">Methodology</span>
      </div>

      ${info.category ? `<p><strong>Category:</strong> ${escapeHtml(info.category)}</p>` : ""}
      ${info.tags ? `<p><strong>Tags:</strong> ${escapeHtml(info.tags)}</p>` : ""}
      ${methodologyBody ? `<p class="post-body">${formatText(methodologyBody)}</p>` : ""}
      ${methodologyLink ? `<p><a class="btn" href="${escapeHtml(methodologyLink)}" target="_blank">Open Link</a></p>` : ""}
    </article>
  `;
}

  box.innerHTML = data.posts.map(post => {
    if (post.type === "blog") {
      const info = parseJsonBody(post.body);

      return `
        <article class="post-card">
          <div class="post-card-header">
            <div>
              <h3>${escapeHtml(post.title)}</h3>
              <p class="post-meta">
                ${escapeHtml(info.websiteName || "Blog")} ${info.author ? "· " + escapeHtml(info.author) : ""}
              </p>
            </div>
            <span class="post-badge">Blog</span>
          </div>

          ${info.tags ? `<p><strong>Tags:</strong> ${escapeHtml(info.tags)}</p>` : ""}
          ${info.summary ? `<p class="post-body">${formatText(info.summary)}</p>` : ""}
          ${post.link ? `<p><a class="btn" href="${escapeHtml(post.link)}" target="_blank">Open Original Link</a></p>` : ""}
        </article>
      `;
    }

    if (post.type === "study_post") {
      const info = parseJsonBody(post.body);
      const studyBody = info.body || "";
      const studyLink = info.link || post.link || "";

      return `
        <article class="post-card">
          <div class="post-card-header">
            <div>
              <h3>${escapeHtml(post.title)}</h3>
              <p class="post-meta">${escapeHtml(post.author_name || "Admin")} · Study</p>
            </div>
            <span class="post-badge">Study</span>
          </div>

          ${info.category ? `<p><strong>Category:</strong> ${escapeHtml(info.category)}</p>` : ""}
          ${info.tags ? `<p><strong>Tags:</strong> ${escapeHtml(info.tags)}</p>` : ""}
          ${studyBody ? `<p class="post-body">${formatText(studyBody)}</p>` : ""}
          ${studyLink ? `<p><a class="btn" href="${escapeHtml(studyLink)}" target="_blank">Open Link</a></p>` : ""}
        </article>
      `;
    }

    return "";
  }).join("");
}

loadPosts();
</script>
</body>
</html>
